name: Check MCP

on:
  push:
    branches: [main]
    paths: &mcp_paths
      - 'mcp/**'
      - 'Dockerfile.mcp*'
      - 'shared/mcp/**'
      - 'server/**'
      - 'lib/swu-resources/types.ts'
      - 'lib/swu-resources/set-info.ts'
      - 'types/**'
      - 'frontend/src/lib/mcpPrivacy*'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths: *mcp_paths

permissions:
  contents: read

concurrency:
  group: mcp-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun ci
      - run: bun run mcp:check
