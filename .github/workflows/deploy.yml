name: Deploy changed services

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to redeploy from the current main branch
        type: choice
        required: true
        default: all
        options: [all, main, maintainer, crossfire]
      dry_run:
        description: Show the deployment plan without calling Coolify
        type: boolean
        default: true

permissions:
  contents: read

# Do not cancel/coalesce entire runs: successive pushes can affect different
# services. Concurrency belongs to each selected service below.
jobs:
  plan:
    name: Check deployment routing and select services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      migration_changes: ${{ steps.plan.outputs.migration_changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test deployment tooling
        run: node --test scripts/deploy/*.test.mjs
      - name: Plan deployments
        id: plan
        env:
          AUTO_DEPLOY_ENABLED: ${{ vars.COOLIFY_DEPLOY_ENABLED }}
        run: node scripts/deploy/plan.mjs

  deploy:
    name: Request ${{ matrix.service }} deployment
    needs: plan
    if: >-
      github.repository == 'the-medo/swu-collection' &&
      github.ref == 'refs/heads/main' &&
      needs.plan.outputs.has_changes == 'true' &&
      ((github.event_name == 'push' && vars.COOLIFY_DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: coolify-${{ matrix.service }}
      cancel-in-progress: false
    steps:
      - name: Hold Crossfire until the main app migrations are verified
        if: >-
          github.event_name == 'push' && matrix.service == 'crossfire' &&
          needs.plan.outputs.migration_changes == 'true'
        run: |
          echo '::error::Crossfire was not deployed because migration inputs changed or the previous revision is unavailable. Pause further production pushes, wait for the main app deployment, verify Migration complete and Server running in its logs, then run this workflow manually for crossfire. Rerunning this push will keep this guard.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Trigger Coolify
        env:
          DEPLOY_SERVICE: ${{ matrix.service }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets[matrix.webhook_secret] }}
        run: node scripts/deploy/trigger.mjs
