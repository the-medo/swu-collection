name: Deploy changed services

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to redeploy from the current main branch
        type: choice
        required: true
        default: all
        options: [all, main, maintainer, crossfire]
      dry_run:
        description: Show the deployment plan without calling Coolify
        type: boolean
        default: true

permissions:
  contents: read

# Do not cancel/coalesce entire runs: successive pushes can affect different
# services. Concurrency belongs to each selected service below.
jobs:
  plan:
    name: Check deployment routing and select services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # Read the migration approval environment's protection rules.
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      crossfire_approval_required: ${{ steps.plan.outputs.crossfire_approval_required }}
      crossfire_approval_ready: ${{ steps.plan.outputs.crossfire_approval_ready }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test deployment tooling
        run: node --test scripts/deploy/*.test.mjs
      - name: Plan deployments
        id: plan
        env:
          AUTO_DEPLOY_ENABLED: ${{ vars.COOLIFY_DEPLOY_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy/plan.mjs

  deploy:
    name: Request ${{ matrix.service }} deployment
    needs: plan
    if: >-
      github.repository == 'the-medo/swu-collection' &&
      github.ref == 'refs/heads/main' &&
      needs.plan.outputs.has_changes == 'true' &&
      ((github.event_name == 'push' && vars.COOLIFY_DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: coolify-${{ matrix.service }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Trigger Coolify
        env:
          DEPLOY_SERVICE: ${{ matrix.service }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets[matrix.webhook_secret] }}
        run: node scripts/deploy/trigger.mjs

  crossfire_migration_approval:
    name: Approve Crossfire deployment after migrations
    needs: plan
    if: >-
      github.repository == 'the-medo/swu-collection' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' && vars.COOLIFY_DEPLOY_ENABLED == 'true' &&
      needs.plan.outputs.crossfire_approval_required == 'true' &&
      needs.plan.outputs.crossfire_approval_ready == 'true'
    environment: crossfire-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Approval waits outside the request queue, so an obsolete waiting run
    # does not block an explicit manual Crossfire deployment.
    steps:
      - name: Confirm migration handoff approval
        run: echo 'Crossfire deployment approved after verification of the main app migration.'

  crossfire_after_migrations:
    name: Request crossfire deployment after migrations
    needs: [plan, crossfire_migration_approval]
    if: >-
      github.repository == 'the-medo/swu-collection' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' && vars.COOLIFY_DEPLOY_ENABLED == 'true' &&
      needs.plan.outputs.crossfire_approval_required == 'true' &&
      needs.plan.outputs.crossfire_approval_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: coolify-crossfire
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Trigger Coolify after migration approval
        env:
          DEPLOY_SERVICE: crossfire
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_CROSSFIRE }}
        run: node scripts/deploy/trigger.mjs
